[project]
name = "h3-studio"
version = "0.1.0"
description = "Local-first multimodal workspace for the MiniMax H3 video API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "httpx[socks]==0.28.1",
  "python-dotenv==1.1.1",
  "python-multipart==0.0.20",
  "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
