minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: uv run --offline trailing-whitespace-fixer
        language: system
        types: [text]
      - id: end-of-file-fixer
        name: fix end of files
        entry: uv run --offline end-of-file-fixer
        language: system
        types: [text]
      - id: check-yaml
        name: validate YAML
        entry: uv run --offline check-yaml
        language: system
        types: [yaml]
      - id: check-toml
        name: validate TOML
        entry: uv run --offline check-toml
        language: system
        types: [toml]
      - id: check-merge-conflict
        name: reject merge conflict markers
        entry: uv run --offline check-merge-conflict
        language: system
        types: [text]
      - id: detect-private-key
        name: reject private keys
        entry: uv run --offline detect-private-key
        language: system
        types: [text]
      - id: check-added-large-files
        name: reject large files
        entry: uv run --offline check-added-large-files --maxkb=2048
        language: system
      - id: detect-secrets
        name: detect committed secrets
        entry: uv run --offline detect-secrets-hook
        language: system
        types: [text]
        exclude: ^uv\.lock$
      - id: ruff-check
        name: Ruff lint
        entry: uv run --offline ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: uv run --offline ruff format
        language: system
        types: [python]
      - id: javascript-syntax
        name: JavaScript syntax
        entry: uv run --offline python scripts/check_javascript.py
        language: system
        types: [javascript]
